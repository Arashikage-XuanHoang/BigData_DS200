services:
  # --- Message broker (Kafka, chế độ KRaft - không cần Zookeeper) ---
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # --- Storage layer (MongoDB) ---
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # --- Server 1: nhận khung hình & gửi vào Kafka (Producer) ---
  capture-server:
    build: ./capture-server
    container_name: capture-server
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - RAW_TOPIC=raw-frames
      - IMAGE_DIR=/app/sample-images
      - CAMERA_ID=cam01
      - LOOP=true
      - INTERVAL_SECONDS=10
    volumes:
      - ./sample-images:/app/sample-images:ro
    restart: on-failure

  # --- Server 2: nhận diện người bằng YOLO (Consumer + Producer) ---
  processing-server:
    build: ./processing-server
    container_name: processing-server
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - RAW_TOPIC=raw-frames
      - RESULT_TOPIC=detection-results
      - MODEL_PATH=yolov8n.pt
      - CONF_THRESHOLD=0.4
    restart: on-failure

  # --- Server 3: lưu kết quả vào MongoDB (Consumer) ---
  storage-server:
    build: ./storage-server
    container_name: storage-server
    depends_on:
      - kafka
      - mongodb
    environment:
      - KAFKA_BROKER=kafka:9092
      - RESULT_TOPIC=detection-results
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=people_counting
      - COLLECTION_NAME=detections
    restart: on-failure

volumes:
  kafka_data:
  mongo_data: